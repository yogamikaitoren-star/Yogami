<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yogami Novel Reader</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;
    background:
    radial-gradient(circle at top,#39216b,#111 45%,#050505);
}

header{
    text-align:center;
    padding:25px 15px;
    background:#111b;
    backdrop-filter:blur(15px);
    border-bottom:1px solid #333;
}

header h1{
    font-size:27px;
}

header p{
    color:#aaa;
    margin-top:6px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.title{
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(160px,1fr));
    gap:18px;
}

.card{
    padding:10px;
    border-radius:18px;
    background:#ffffff0d;
    border:1px solid #ffffff18;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    background:#ffffff18;
}

.cover{
    width:100%;
    aspect-ratio:2/3;
    object-fit:cover;
    border-radius:13px;
    background:#222;
}

.card h3{
    margin-top:10px;
    font-size:16px;
    text-transform:capitalize;
}

.card p{
    color:#888;
    font-size:13px;
    margin-top:5px;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:40px;
}

/* READER */

#reader{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    background:#080808;
}

.top{
    height:65px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:10px 15px;
    background:#111;
    border-bottom:1px solid #333;
}

.back{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    background:#292929;
    color:white;
}

#novelTitle{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

iframe{
    width:100%;
    height:calc(100vh - 130px);
    border:0;
}

.bottom{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    background:#111;
    border-top:1px solid #333;
}

.bottom button{
    border:0;
    border-radius:10px;
    padding:11px 17px;
    background:#292929;
    color:white;
}

@media(max-width:600px){
    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📖 Yogami Novel Reader</h1>
    <p>Koleksi novel kamu</p>
</header>

<div class="container">

    <h2 class="title">📚 Semua Novel</h2>

    <div id="novelGrid" class="grid">
        <div class="loading">
            ⏳ Memuat novel dari GitHub...
        </div>
    </div>

</div>


<!-- PEMBACA PDF -->

<div id="reader">

    <div class="top">

        <button class="back" onclick="closeReader()">
            ← Kembali
        </button>

        <h3 id="novelTitle">
            Novel
        </h3>

    </div>

    <iframe id="pdfViewer"></iframe>

    <div class="bottom">

        <button onclick="previousNovel()">
            ⬅ Sebelumnya
        </button>

        <span id="number">
            1 / 1
        </span>

        <button onclick="nextNovel()">
            Berikutnya ➡
        </button>

    </div>

</div>


<script>

const OWNER = "yogamikaitoren-star";
const REPO = "Yogami";
const BRANCH = "main";

let novels = [];
let current = 0;


/* MENGAMBIL SEMUA FILE DARI GITHUB */

async function loadNovels(){

    const grid =
        document.getElementById("novelGrid");

    try{

        const url =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;

        const response =
        await fetch(url);

        if(!response.ok){
            throw new Error("Gagal mengakses GitHub");
        }

        const files =
        await response.json();

        novels = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".pdf")
        );

        showNovels();

    }catch(error){

        grid.innerHTML = `
            <div class="loading">
                ❌ Gagal mengambil PDF dari GitHub.
                <br><br>
                ${error.message}
            </div>
        `;

    }

}


/* TAMPILKAN NOVEL */

function showNovels(){

    const grid =
        document.getElementById("novelGrid");

    grid.innerHTML = "";

    if(novels.length === 0){

        grid.innerHTML = `
            <div class="loading">
                📚 Belum ada PDF di repository.
            </div>
        `;

        return;
    }


    novels.forEach((file,index)=>{

        const card =
            document.createElement("div");

        card.className = "card";


        const title =
            file.name
            .replace(/\.pdf$/i,"")
            .replace(/[-_]/g," ");


        card.innerHTML = `

            <img
                class="cover"
                src="https://placehold.co/400x600/181818/ffffff?text=NOVEL"
            >

            <h3>${title}</h3>

            <p>📄 PDF</p>

        `;


        card.onclick = () => {
            openNovel(index);
        };


        grid.appendChild(card);

    });

}


/* BUKA NOVEL */

function openNovel(index){

    current = index;

    const file =
        novels[current];

    document.getElementById("reader")
        .style.display = "block";

    document.getElementById("novelTitle")
        .innerText =
        file.name.replace(/\.pdf$/i,"");

    document.getElementById("pdfViewer")
        .src =
        `https://yogamikaitoren-star.github.io/Yogami/${encodeURIComponent(file.name)}`;

    updateNumber();

}


/* TUTUP NOVEL */

function closeReader(){

    document.getElementById("reader")
        .style.display = "none";

    document.getElementById("pdfViewer")
        .src = "";

}


/* NEXT */

function nextNovel(){

    if(current < novels.length - 1){

        current++;

        openNovel(current);

    }

}


/* PREVIOUS */

function previousNovel(){

    if(current > 0){

        current--;

        openNovel(current);

    }

}


/* NOMOR */

function updateNumber(){

    document.getElementById("number")
        .innerText =
        `${current+1} / ${novels.length}`;

}


/* MULAI */

loadNovels();

</script>

</body>
</html>
