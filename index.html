<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yogami Novel Reader</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;

    background:
    radial-gradient(
        circle at top,
        #6d28d9,
        #171020 45%,
        #050505
    );
}

/* =========================
   HEADER
========================= */

header{
    text-align:center;
    padding:30px 15px;

    background:#00000066;
    backdrop-filter:blur(15px);

    border-bottom:1px solid #ffffff20;
}

header h1{
    font-size:28px;
}

header p{
    margin-top:8px;
    color:#aaa;
}


/* =========================
   CONTENT
========================= */

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

.title{
    margin-bottom:20px;
}


/* =========================
   NOVEL GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(170px,1fr));

    gap:20px;
}


/* =========================
   NOVEL CARD
========================= */

.card{
    padding:10px;

    border-radius:18px;

    background:#ffffff0d;

    border:1px solid #ffffff20;

    cursor:pointer;

    transition:.3s;

    box-shadow:
    0 10px 30px #0006;
}

.card:hover{
    transform:translateY(-7px);

    background:#ffffff18;
}


/* =========================
   COVER
========================= */

.cover{
    width:100%;

    aspect-ratio:2/3;

    object-fit:cover;

    display:block;

    border-radius:13px;

    background:#222;
}


.card h3{
    margin-top:12px;

    font-size:17px;
}


.card p{
    margin-top:6px;

    color:#aaa;

    font-size:13px;
}


/* =========================
   READER
========================= */

#reader{

    display:none;

    position:fixed;

    inset:0;

    z-index:1000;

    background:#080808;
}


/* =========================
   TOP BAR
========================= */

.top{

    height:65px;

    display:flex;

    align-items:center;

    gap:15px;

    padding:10px 15px;

    background:#111;

    border-bottom:1px solid #333;
}


.back{

    border:0;

    border-radius:10px;

    padding:10px 15px;

    background:#292929;

    color:white;

    cursor:pointer;

    font-size:14px;
}


#novelTitle{

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================
   READER CONTENT
========================= */

.readerContent{

    height:calc(100vh - 130px);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px;

    background:
    radial-gradient(
        circle at center,
        #251438,
        #050505 70%
    );
}


.readerContent h2{

    font-size:25px;

    margin-bottom:10px;
}


.readerContent p{

    color:#aaa;

    margin-bottom:25px;
}


/* =========================
   READ BUTTON
========================= */

.readButton{

    display:inline-block;

    padding:15px 28px;

    border-radius:14px;

    background:#7c3aed;

    color:white;

    text-decoration:none;

    font-size:17px;

    font-weight:bold;

    border:1px solid #a78bfa;

    box-shadow:
    0 8px 30px #0007;

    transition:.3s;
}


.readButton:hover{

    transform:scale(1.05);

    background:#8b5cf6;
}


/* =========================
   BOTTOM
========================= */

.bottom{

    height:65px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#111;

    border-top:1px solid #333;
}


.bottom button{

    border:0;

    border-radius:10px;

    padding:11px 18px;

    background:#292929;

    color:white;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .grid{

        grid-template-columns:
        repeat(2,1fr);

        gap:12px;
    }

    header h1{

        font-size:23px;
    }

    .readerContent h2{

        font-size:21px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        📖 Yogami Novel Reader
    </h1>

    <p>
        Koleksi Novel Pribadi
    </p>

</header>



<!-- =========================
     NOVEL LIST
========================= -->

<div class="container">

    <h2 class="title">
        📚 Koleksi Novel
    </h2>


    <div class="grid">


        <!-- NOVEL 1 -->

        <div
            class="card"
            onclick="bukaNovel()"
        >


            <img
                class="cover"
                src="Sampai_Senja_Terakhir_Directors_Cut_Remaster_Yogami.png"
                alt="Sampai Senja Terakhir"
            >


            <h3>
                Sampai Senja Terakhir
            </h3>


            <p>
                📄 PDF • Director's Cut Remaster
            </p>


        </div>


    </div>

</div>



<!-- =========================
     READER
========================= -->

<div id="reader">


    <!-- TOP -->

    <div class="top">


        <button
            class="back"
            onclick="tutupNovel()"
        >

            ← Kembali

        </button>


        <h3 id="novelTitle">

            Sampai Senja Terakhir

        </h3>


    </div>



    <!-- CONTENT -->

    <div class="readerContent">


        <h2>
            📖 Sampai Senja Terakhir
        </h2>


        <p>
            Director's Cut Remaster
        </p>


        <a
            class="readButton"
            href="NOVEL_SAMPAI_SENJA_TERAKHIR_BY_YOGAMI.pdf"
            target="_blank"
            rel="noopener"
        >

            📖 BACA NOVEL

        </a>


    </div>



    <!-- BOTTOM -->

    <div class="bottom">


        <button
            onclick="tutupNovel()"
        >

            ✕ Tutup

        </button>


    </div>


</div>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   BUKA NOVEL
========================= */

function bukaNovel(){

    document.getElementById("reader")
        .style.display = "block";

}


/* =========================
   TUTUP NOVEL
========================= */

function tutupNovel(){

    document.getElementById("reader")
        .style.display = "none";

}


</script>


</body>

</html>
